name: Build Linux DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Periksa alamat server produksi
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "Isi repository variable VITE_SERVER_URL dengan alamat API produksi terlebih dahulu."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Pasang dependensi Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Build paket Debian
        run: npm run dist:deb
      - name: Periksa identitas dan arsitektur paket
        run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            test "$(dpkg-deb --field "$package" Package)" = "mgo-desktop"
            test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
            dpkg-deb --info "$package"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: MgoDesktop-linux-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
