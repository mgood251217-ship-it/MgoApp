name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Periksa alamat server produksi
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SERVER_URL)) {
            throw "Isi repository variable VITE_SERVER_URL dengan alamat API produksi terlebih dahulu."
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build installer Windows
        run: npm run dist -- --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: MgoDesktop-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
