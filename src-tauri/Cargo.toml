[package]
name = "mgo-desktop"
version = "2.1.1"
description = "Aplikasi POS internal Mgo Desktop untuk transaksi cepat, praktis, dan akurat."
authors = ["Viki Alvian Riyadi <mgood251217@gmail.com>"]
edition = "2021"

[lib]
name = "mgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
futures-util = "0.3"
chrono = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
