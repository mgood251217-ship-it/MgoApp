[package]
name = "mgo-desktop"
version = "2.0.7"
description = "Aplikasi POS internal Mgo Desktop untuk transaksi cepat, praktis, dan akurat."
authors = ["Viki Alvian Riyadi <mgood251217@gmail.com>"]
edition = "2021"
default-run = "mgo-desktop"

[features]
folder-protection-service = []

[[bin]]
name = "mgo-folder-protection"
path = "src/security_service.rs"
required-features = ["folder-protection-service"]

[lib]
name = "mgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "net", "time", "io-util", "rt", "macros", "sync"] }
futures-util = "0.3"
chrono = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_EventLog", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
